name: 更新收盤價

on:
  schedule:
    # 台灣時間週一到週五 17:07 和 21:07（證交所收盤資料約傍晚公布）
    - cron: '7 9,13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取上市、上櫃、興櫃收盤價
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, datetime, sys

          SOURCES = {
              "twse": "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
              "tpex": "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes",
              "esb":  "https://www.tpex.org.tw/openapi/v1/tpex_esb_latest_statistics",
          }
          CODE_KEYS  = ["Code", "SecuritiesCompanyCode", "CompanyCode", "證券代號"]
          PRICE_KEYS = ["ClosingPrice", "Close", "LatestPrice", "收盤價", "Average", "AveragePrice", "PreviousAveragePrice"]
          DATE_KEYS  = ["Date", "日期"]

          def to_date(s):
              s = re.sub(r"[^0-9]", "", str(s or ""))
              if len(s) == 7:  # 民國年 1151016
                  return f"{int(s[:3]) + 1911:04d}-{s[3:5]}-{s[5:]}"
              if len(s) == 8:
                  return f"{s[:4]}-{s[4:6]}-{s[6:]}"
              return datetime.date.today().isoformat()

          def to_price(v):
              try:
                  x = float(str(v).replace(",", ""))
                  return x if x > 0 else None
              except Exception:
                  return None

          prices, dates, ok = {}, {}, 0
          for name, url in SOURCES.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"})
                  rows = json.load(urllib.request.urlopen(req, timeout=60))
                  n = 0
                  for r in rows:
                      code = next((str(r[k]).strip() for k in CODE_KEYS if r.get(k)), None)
                      price = next((to_price(r[k]) for k in PRICE_KEYS if to_price(r.get(k))), None)
                      if not code or price is None:
                          continue
                      d = to_date(next((r[k] for k in DATE_KEYS if r.get(k)), ""))
                      prices[code] = [round(price, 4), d]
                      dates[name] = max(dates.get(name, ""), d)
                      n += 1
                  print(f"{name}: {n} 筆", "（欄位：" + ", ".join(rows[0].keys()) + "）" if rows and n == 0 else "")
                  ok += n > 0
              except Exception as e:
                  print(f"{name}: 失敗 {e}")

          if not ok:
              sys.exit("全部資料來源都抓取失敗")
          out = {"updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "dates": dates, "p": prices}
          with open("prices.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print("共", len(prices), "檔")
          PY

      - name: 儲存到 repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "更新收盤價 $(date -u +%F)"
          git push
