name: 更新收盤價

on:
  schedule:
    # 台灣時間週一到週五 17:07、21:07，以及隔天早上 08:07（證交所資料有時較晚公布）
    - cron: '7 9,13 * * 1-5'
    - cron: '7 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 抓取上市、上櫃、興櫃收盤價
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, datetime, sys, csv, io, time, os

          # 同一個市場可放多個來源，同一檔股票取日期較新的那個
          SOURCES = [
              ("twse", "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"),
              ("twse", "https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY_ALL?response=json"),
              ("tpex", "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes"),
              ("esb",  "https://www.tpex.org.tw/openapi/v1/tpex_esb_latest_statistics"),
          ]
          CODE_KEYS  = ["Code", "SecuritiesCompanyCode", "CompanyCode", "證券代號", "代號"]
          PRICE_KEYS = ["ClosingPrice", "Close", "LatestPrice", "收盤價", "Average", "AveragePrice", "PreviousAveragePrice"]
          DATE_KEYS  = ["Date", "日期"]

          def to_date(s):
              s = re.sub(r"[^0-9]", "", str(s or ""))
              if len(s) == 7:  # 民國年 1151016
                  return f"{int(s[:3]) + 1911:04d}-{s[3:5]}-{s[5:]}"
              if len(s) == 8:
                  return f"{s[:4]}-{s[4:6]}-{s[6:]}"
              return ""

          def to_price(v):
              try:
                  x = float(str(v).replace(",", ""))
                  return x if x > 0 else None
              except Exception:
                  return None

          def to_rows(raw):
              # 可能是 JSON（list 或 {"fields","data"}），也可能是開頭帶 BOM 的 CSV
              text = raw.decode("utf-8-sig", errors="replace").strip()
              try:
                  data = json.loads(text)
              except Exception:
                  lines = [l for l in text.splitlines() if l.strip()]
                  start = next((i for i, l in enumerate(lines) if "證券代號" in l or "代號" in l), None)
                  if start is None:
                      raise ValueError("看不懂的格式，開頭是：" + text[:80])
                  return list(csv.DictReader(io.StringIO("\n".join(lines[start:]))))
              if isinstance(data, list):
                  return data
              if isinstance(data, dict) and "fields" in data and "data" in data:
                  rows = [dict(zip(data["fields"], r)) for r in data["data"]]
                  for r in rows:
                      r.setdefault("Date", data.get("date", ""))
                  return rows
              return []

          def download(url):
              # 連線中斷時重試，最多 3 次
              for i in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"})
                      return urllib.request.urlopen(req, timeout=90).read()
                  except Exception as e:
                      if i == 2:
                          raise
                      print(f"  重試 {i + 1}：{e}")
                      time.sleep(5 * (i + 1))

          # 先讀入上一次的結果：某個來源這次失敗時，保留它上次的價格，不會整批消失
          prices, dates, ok = {}, {}, 0
          if os.path.exists("prices.json"):
              try:
                  old = json.load(open("prices.json", encoding="utf-8"))
                  prices, dates = old.get("p", {}), old.get("dates", {})
              except Exception:
                  pass

          for name, url in SOURCES:
              try:
                  rows = to_rows(download(url))
                  n, newest = 0, ""
                  for r in rows:
                      code = next((str(r[k]).strip() for k in CODE_KEYS if r.get(k)), None)
                      price = next((to_price(r[k]) for k in PRICE_KEYS if to_price(r.get(k))), None)
                      if not code or price is None:
                          continue
                      d = to_date(next((r[k] for k in DATE_KEYS if r.get(k)), "")) or datetime.date.today().isoformat()
                      if code not in prices or d > prices[code][1]:
                          prices[code] = [round(price, 4), d]
                      newest = max(newest, d)
                      n += 1
                  if n:
                      dates[name] = max(dates.get(name, ""), newest)
                  print(f"{name} {url[:60]}: {n} 筆，日期 {newest or '-'}", "（欄位：" + ", ".join(rows[0].keys()) + "）" if rows and n == 0 else "")
                  ok += n > 0
              except Exception as e:
                  print(f"{name} {url[:60]}: 失敗 {e}")

          if not ok:
              sys.exit("全部資料來源都抓取失敗")
          out = {"updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "dates": dates, "p": prices}
          with open("prices.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print("共", len(prices), "檔")
          PY

      - name: 儲存到 repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "更新收盤價 $(date -u +%F)"
          git push

