<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PREVIEW-START-->
<title>我的股票帳本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: 像素風老電腦桌面 — 上方螢幕顯示總覽，下方是一個個像素視窗；單一米色主題 */
:root{
  --sky:#f6eedb; --sand:#ecd5aa; --soil:#b98258; --soil-dk:#7a4b2a;
  --paper:#fffaf0; --yellow:#ffd84a; --yellow-dk:#e9b923; --ink:#221c17; --ink-2:#5c4e42; --ink-3:#8f8173;
  --screen:#2a2622; --screen-2:#3a3530; --screen-fg:#fff6e0;
  --up:#d8392b; --down:#2c8f44; --up-scr:#ff7a68; --down-scr:#73e087;
  --grass:#66b83a; --grass-dk:#3f8a27; --blue:#5aa7e0;
  --f-body:"Huninn","jf open 粉圓","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-px:"Space Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --px:4px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.n{font-family:var(--f-px);font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.1}
.up{color:var(--up)} .down{color:var(--down)} .soft{color:var(--ink-2)} .faint{color:var(--ink-3)}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}

/* 像素外框：四邊各一道陰影，留出缺角 */
.px{box-shadow:0 calc(var(--px)*-1) 0 0 var(--ink),0 var(--px) 0 0 var(--ink),calc(var(--px)*-1) 0 0 0 var(--ink),var(--px) 0 0 0 var(--ink)}
.px-drop{box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),8px 8px 0 0 rgba(122,75,42,.28)}

/* ---- sky / header ---- */
.sky{position:relative;padding-block:22px 8px;overflow:hidden}
.cloud{position:absolute;width:8px;height:8px;background:#fff;image-rendering:pixelated;pointer-events:none;opacity:.95}
.cloud.a{top:26px;left:4%;box-shadow:8px 0 #fff,16px 0 #fff,24px 0 #fff,8px -8px #fff,16px -8px #fff,16px -16px #fff,24px -8px #fff,32px 0 #fff,40px 0 #fff,32px -8px #fff,-8px 0 #fff,0 8px #d9d2c4,8px 8px #d9d2c4,16px 8px #d9d2c4,24px 8px #d9d2c4,32px 8px #d9d2c4,40px 8px #d9d2c4}
.cloud.b{top:58px;right:6%;transform:scale(1.4);box-shadow:8px 0 #fff,16px 0 #fff,24px 0 #fff,32px 0 #fff,8px -8px #fff,16px -8px #fff,24px -8px #fff,16px -16px #fff,40px 0 #fff,-8px 0 #fff,0 8px #d9d2c4,8px 8px #d9d2c4,16px 8px #d9d2c4,24px 8px #d9d2c4,32px 8px #d9d2c4,40px 8px #d9d2c4}
.spark{position:absolute;width:6px;height:6px;background:var(--yellow);box-shadow:0 -6px var(--yellow),0 6px var(--yellow),-6px 0 var(--yellow),6px 0 var(--yellow),0 -12px #ffeaa0,0 12px #ffeaa0,-12px 0 #ffeaa0,12px 0 #ffeaa0}
.topline{position:relative;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo .icon{width:40px;height:40px;background:var(--yellow);display:grid;place-items:center;font-size:22px}
.logo h1{font-size:28px;letter-spacing:.06em}
.logo small{display:block;font-size:13px;color:var(--ink-2);letter-spacing:.02em;margin-top:-4px}
.tabs{margin-left:auto;display:flex;gap:12px;padding:4px}
.tab{border:0;background:var(--paper);padding:6px 16px;cursor:pointer;font-size:16px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--yellow)}

/* ---- monitor ---- */
.monitor{margin-top:24px;background:#efe3c8;padding:18px;position:relative}
.screen{background:var(--screen);color:var(--screen-fg);padding:22px 24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 26px;align-items:start;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px)}
.stat{display:grid;gap:6px;min-width:0}
.stat .lb{font-size:14px;color:#cfc4ae;letter-spacing:.08em}
.stat .v{font-family:var(--f-px);font-weight:700;font-size:clamp(30px,4.2vw,46px);line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.stat.main .v{color:var(--yellow)}
.stat.pl{grid-column:1/-1;border-top:2px dashed rgba(255,246,224,.18);padding-top:16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.stat.pl .lb{width:100%}
.stat.pl .v{font-size:clamp(34px,5vw,56px)}
.stat.pl .s{font-size:clamp(20px,2.4vw,28px);font-weight:700}
.stat .s{font-family:var(--f-px);font-size:15px;color:#cfc4ae}
.screen .up{color:var(--up-scr)} .screen .down{color:var(--down-scr)}
.mon-foot{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.leds{display:flex;gap:8px}
.leds i{width:12px;height:12px;background:#d33}
.leds i+i{background:#4c4}
.mon-foot .hint{font-size:13px;color:var(--ink-2)}
.mon-foot .btn{margin-left:auto}
@media (max-width:760px){
  .screen{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .stat.div{grid-column:1/-1}
  .tabs{margin-left:0;width:100%}
  .tab{flex:1}
}
@media (max-width:480px){.screen{grid-template-columns:minmax(0,1fr);gap:16px}.stat .v{font-size:30px}.stat.pl .v{font-size:38px}}

/* ---- buttons ---- */
.btn{border:0;background:var(--yellow);padding:8px 18px;cursor:pointer;font-size:16px;position:relative;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;line-height:1.3}
.btn:hover{background:#ffe27a}
.btn:active{transform:translate(2px,2px)}
.btn.big{font-size:19px;padding:12px 26px}
.btn.plain{background:var(--paper)}
.btn.plain:hover{background:#fff}
.btn.dark{background:var(--ink);color:var(--yellow)}
.btn.danger{background:var(--paper);color:var(--up)}
.btn.danger.armed{background:var(--up);color:#fff}
.btn.sm{font-size:14px;padding:4px 12px}
.link{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.link:hover{color:var(--ink)}

/* ---- windows ---- */
main{padding-block:28px 40px;display:grid;gap:30px}
.win{background:var(--paper);min-width:0}
.win-t{display:flex;align-items:center;gap:10px;background:var(--yellow);padding:6px 14px;border-bottom:4px solid var(--ink);flex-wrap:wrap}
.win-t h2{font-size:19px;letter-spacing:.04em}
.win-t .sub{font-size:13px;color:var(--ink-2)}
.win-t .end{margin-left:auto;display:flex;gap:10px;align-items:center}
.win-t .dots{display:flex;gap:6px;margin-left:auto}
.win-t .dots i{width:10px;height:10px;background:var(--ink)}
.win-b{padding:18px}
.banner{background:var(--yellow);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:200px}

/* ---- holdings ---- */
.hold-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
@media (max-width:420px){.hold-grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);display:grid;min-width:0}
.card .ct{display:flex;align-items:baseline;gap:8px;padding:8px 14px;border-bottom:4px solid var(--ink);background:#fff3c4}
.card .ct b{font-weight:400;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ct .code{font-family:var(--f-px);font-size:14px;color:var(--ink-2)}
.card .ct .tag{margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.card .cb{padding:14px;display:grid;gap:12px}
.pl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pl .big{font-family:var(--f-px);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.02em}
.pl .pct{font-family:var(--f-px);font-weight:700;font-size:16px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px}
.kv div{display:grid;gap:2px;min-width:0}
.kv span{font-size:12px;color:var(--ink-3)}
.kv b{font-family:var(--f-px);font-weight:700;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.price-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.price-row label{font-size:14px;color:var(--ink-2)}
.price-in{width:110px;padding:4px 10px;border:0;background:#fff;font-family:var(--f-px);font-weight:700;font-size:17px;text-align:right}
.price-in.dirty{background:#fff3c4}
.price-row .when{font-size:12px;color:var(--ink-3)}
.loadbar{display:flex;align-items:center;gap:10px}
.loadbar .track{flex:1;display:flex;gap:3px;padding:3px;background:#fff;min-width:0}
.loadbar .track i{flex:1;height:12px;background:#ece4d3}
.loadbar .track i.on{background:var(--grass)}
.loadbar span{font-family:var(--f-px);font-size:14px;min-width:52px;text-align:right}
.loadbar small{font-size:12px;color:var(--ink-3)}

/* ---- chart ---- */
.chart{display:block;width:100%}
.chart text{font-family:var(--f-px);font-size:12px;fill:var(--ink-2)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-bottom:10px;align-items:center}
.legend i{display:inline-block;width:14px;height:8px;vertical-align:middle;margin-right:6px}

/* ---- records ---- */
.rec-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}
@media (max-width:640px){.rec-stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rec-stats .win:first-child{grid-column:1/-1}}
.mini{background:var(--paper);padding:12px 16px;display:grid;gap:4px}
.mini span{font-size:13px;color:var(--ink-2)}
.mini b{font-family:var(--f-px);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.02em}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sel{border:0;background:#fff;padding:5px 10px;font-size:15px}
.rec{list-style:none;margin:0;padding:0}
.rec li{display:grid;grid-template-columns:90px 72px minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 18px;border-bottom:2px dashed #e3d7bf;cursor:pointer}
.rec li:last-child{border-bottom:0}
.rec li:hover,.rec li:focus-visible{background:#fff3c4}
.rec .d{font-family:var(--f-px);font-size:14px;color:var(--ink-2)}
.rec .what{min-width:0}
.rec .what b{font-weight:400;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .what small{color:var(--ink-3);font-size:13px}
.rec .amt{font-family:var(--f-px);font-weight:700;font-size:17px;text-align:right}
@media (max-width:520px){.rec li{grid-template-columns:auto minmax(0,1fr) auto}.rec .d{grid-column:1/-1;font-size:13px;margin-bottom:-6px}}
.badge{display:inline-block;padding:1px 8px;font-size:13px;text-align:center;white-space:nowrap}
.badge.buy{background:#ffd9d2;color:#9c2416}
.badge.sell{background:#d3efd8;color:#1d6a31}
.badge.div{background:var(--yellow);color:var(--ink)}
.badge.re{background:#d6e9f8;color:#21557e}
.empty{padding:34px 18px;text-align:center;display:grid;gap:14px;justify-items:center}
.empty p{margin:0;max-width:440px;color:var(--ink-2)}

/* ---- settings ---- */
.set-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lb{font-size:14px;color:var(--ink-2)}
.field .sub{font-size:12px;color:var(--ink-3);line-height:1.5}
.inp{width:100%;border:0;background:#fff;padding:8px 12px;min-width:0;font-size:16px}
.inp.num{font-family:var(--f-px);font-weight:700;font-size:18px;text-align:right;padding-block:4px}
.inp:focus{outline:none;background:#fffbe6}
textarea.inp{min-height:110px;resize:vertical;font-size:13px;font-family:ui-monospace,monospace}
.note{font-size:14px;color:var(--ink-2);line-height:1.8;margin:0}
.note ol{margin:6px 0 0;padding-left:22px}
.note code{background:#f1e8d4;padding:1px 6px;font-size:13px;font-family:ui-monospace,monospace;overflow-wrap:anywhere}
.stack{display:grid;gap:16px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
details summary{cursor:pointer;color:var(--ink-2)}

/* ---- dialog ---- */
dialog{border:0;padding:0;background:transparent;width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:visible}
dialog::backdrop{background:rgba(42,30,20,.55)}
.dlg{background:var(--yellow);max-height:calc(100dvh - 40px);overflow:auto;margin:4px}
.dlg-t{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:4px solid var(--ink)}
.dlg-t h3{font-size:21px}
.xbtn{margin-left:auto;width:32px;height:32px;border:0;background:var(--paper);cursor:pointer;font-family:var(--f-px);font-size:18px;line-height:1}
.dlg-b{padding:18px;display:grid;gap:14px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:4px}
.types button{border:0;background:var(--paper);padding:8px 4px;cursor:pointer;font-size:16px}
.types button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.qty{display:flex;gap:6px}
.qty .inp{flex:1}
.qty select{flex:0 0 62px;border:0;background:var(--paper);padding:0 6px;font-size:16px}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.sum{background:var(--paper);padding:12px 14px;display:grid;gap:4px;font-size:15px}
.sum .ln{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sum .ln .n{font-size:16px;font-weight:700}
.sum .ln.tot{border-top:2px dashed var(--ink-3);padding-top:6px;margin-top:4px}
.sum .ln.tot .n{font-size:21px}
.adv{background:rgba(255,250,240,.6);padding:12px;display:grid;gap:12px}
.hintbox{background:var(--paper);padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hintbox p{margin:0;flex:1;min-width:180px}
.err{background:var(--up);color:#fff;padding:6px 12px;font-size:14px}
.dlg-f{display:flex;gap:14px;padding:4px 18px 20px;flex-wrap:wrap;align-items:center}
.dlg-f .grow{flex:1}

/* combobox */
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:60;background:var(--paper);max-height:260px;overflow:auto;margin:0;padding:4px;list-style:none}
.combo-list li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;cursor:pointer}
.combo-list li .c{font-family:var(--f-px);font-size:15px;color:var(--ink-2)}
.combo-list li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-list li .t{font-size:12px;color:var(--ink-3)}
.combo-list li[aria-selected="true"],.combo-list li:hover{background:#fff3c4}
.combo-list li mark{background:none;color:var(--up)}
.combo-list .none{grid-template-columns:1fr;color:var(--ink-2);cursor:default;font-size:14px}
.picked{font-size:13px;color:var(--ink-2);margin-top:-6px}

/* ground */
.ground{margin-top:auto;height:74px;background:
  linear-gradient(var(--grass) 0 10px,var(--grass-dk) 10px 14px,transparent 14px),
  repeating-linear-gradient(90deg,var(--soil) 0 32px,#a8714a 32px 64px);
  position:relative}
.ground::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;background:repeating-linear-gradient(90deg,var(--grass) 0 8px,transparent 8px 16px,var(--grass) 16px 20px,transparent 20px 32px)}
.ground p{margin:0;position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;color:#f6e5c8;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--yellow);padding:8px 18px;z-index:100;font-size:15px;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s steps(3)}
  @keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
}
</style>
<!--PREVIEW-HEAD-END-->
</head>
<body>
<div class="sky">
  <span class="cloud a"></span><span class="cloud b"></span>
  <span class="spark" style="top:30px;left:46%"></span>
  <div class="wrap">
    <div class="topline">
      <div class="logo"><span class="icon px n" style="font-size:24px;font-weight:700">$</span><div><h1>我的股票帳本</h1><small id="asof"></small></div></div>
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab px" role="tab" data-tab="home" aria-selected="true">首頁</button>
        <button class="tab px" role="tab" data-tab="recs" aria-selected="false">紀錄</button>
        <button class="tab px" role="tab" data-tab="set" aria-selected="false">設定</button>
      </nav>
    </div>
  </div>
</div>
<div class="wrap"><main id="main"></main></div>
<div class="ground" aria-hidden="true"><p>資料只存在這個瀏覽器 · 記得到「設定」備份</p></div>

<dialog id="dlg">
  <form class="dlg px-drop" id="txForm" novalidate>
    <div class="dlg-t"><h3 id="dTitle">記一筆</h3><button type="button" class="xbtn px" id="dClose" aria-label="關閉">×</button></div>
    <div class="dlg-b">
      <div class="types" id="types">
        <button type="button" class="px" data-v="buy" aria-pressed="true">買進</button>
        <button type="button" class="px" data-v="sell" aria-pressed="false">賣出</button>
        <button type="button" class="px" data-v="div" aria-pressed="false">領股利</button>
      </div>
      <div class="field">
        <label for="fStock">哪一檔？</label>
        <div class="combo">
          <input class="inp px" id="fStock" autocomplete="off" placeholder="打代號或名稱，例：0050、台灣" role="combobox" aria-expanded="false" aria-controls="stockList">
          <ul class="combo-list px" id="stockList" role="listbox" hidden></ul>
        </div>
      </div>
      <div class="picked" id="fPicked"></div>
      <div class="two">
        <div class="field"><label for="fDate">日期</label><input class="inp px" type="date" id="fDate"></div>
        <div class="field" id="qtyBox"><label for="fQty">買了多少</label>
          <div class="qty"><input class="inp num px" id="fQty" inputmode="decimal" placeholder="0"><select id="fUnit" class="px" aria-label="單位"><option value="1">股</option><option value="1000">張</option></select></div></div>
        <div class="field" id="amtBox" hidden><label for="fDivAmt">入帳金額</label><input class="inp num px" id="fDivAmt" inputmode="numeric" placeholder="0"></div>
      </div>
      <div class="field" id="priceBox"><label for="fPrice">每股價格</label><input class="inp num px" id="fPrice" inputmode="decimal" placeholder="0.00"></div>
      <div id="reBox" hidden class="stack" style="gap:12px">
        <label class="check"><input type="checkbox" id="fRe"> 這筆股利有再投資（自動買回同一檔）</label>
        <div class="field" id="rePriceBox" hidden><label for="fRePrice">再投資的買進價格</label><input class="inp num px" id="fRePrice" inputmode="decimal" placeholder="0.00"></div>
      </div>

      <div class="sum px" id="sum"></div>
      <div class="hintbox px" id="discHint" hidden></div>
      <button type="button" class="link" id="advToggle" style="justify-self:start">修改手續費、稅或加備註</button>

<script type="text/plain" id="wfSrc">
name: 更新收盤價

on:
  schedule:
    # 台灣時間週一到週五 17:07、21:07，以及隔天早上 08:07（證交所資料有時較晚公布）
    - cron: '7 9,13 * * 1-5'
    - cron: '7 0 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 抓取上市、上櫃、興櫃收盤價
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, datetime, sys, csv, io, time, os

          # 同一個市場可放多個來源，同一檔股票取日期較新的那個
          SOURCES = [
              ("twse", "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"),
              ("twse", "https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY_ALL?response=json"),
              ("tpex", "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes"),
              ("esb",  "https://www.tpex.org.tw/openapi/v1/tpex_esb_latest_statistics"),
          ]
          CODE_KEYS  = ["Code", "SecuritiesCompanyCode", "CompanyCode", "證券代號", "代號"]
          PRICE_KEYS = ["ClosingPrice", "Close", "LatestPrice", "收盤價", "Average", "AveragePrice", "PreviousAveragePrice"]
          DATE_KEYS  = ["Date", "日期"]

          def to_date(s):
              s = re.sub(r"[^0-9]", "", str(s or ""))
              if len(s) == 7:  # 民國年 1151016
                  return f"{int(s[:3]) + 1911:04d}-{s[3:5]}-{s[5:]}"
              if len(s) == 8:
                  return f"{s[:4]}-{s[4:6]}-{s[6:]}"
              return ""

          def to_price(v):
              try:
                  x = float(str(v).replace(",", ""))
                  return x if x > 0 else None
              except Exception:
                  return None

          def to_rows(raw):
              # 可能是 JSON（list 或 {"fields","data"}），也可能是開頭帶 BOM 的 CSV
              text = raw.decode("utf-8-sig", errors="replace").strip()
              try:
                  data = json.loads(text)
              except Exception:
                  lines = [l for l in text.splitlines() if l.strip()]
                  start = next((i for i, l in enumerate(lines) if "證券代號" in l or "代號" in l), None)
                  if start is None:
                      raise ValueError("看不懂的格式，開頭是：" + text[:80])
                  return list(csv.DictReader(io.StringIO("\n".join(lines[start:]))))
              if isinstance(data, list):
                  return data
              if isinstance(data, dict) and "fields" in data and "data" in data:
                  rows = [dict(zip(data["fields"], r)) for r in data["data"]]
                  for r in rows:
                      r.setdefault("Date", data.get("date", ""))
                  return rows
              return []

          def download(url):
              # 連線中斷時重試，最多 3 次
              for i in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"})
                      return urllib.request.urlopen(req, timeout=90).read()
                  except Exception as e:
                      if i == 2:
                          raise
                      print(f"  重試 {i + 1}：{e}")
                      time.sleep(5 * (i + 1))

          # 先讀入上一次的結果：某個來源這次失敗時，保留它上次的價格，不會整批消失
          prices, dates, ok = {}, {}, 0
          if os.path.exists("prices.json"):
              try:
                  old = json.load(open("prices.json", encoding="utf-8"))
                  prices, dates = old.get("p", {}), old.get("dates", {})
              except Exception:
                  pass

          for name, url in SOURCES:
              try:
                  rows = to_rows(download(url))
                  n, newest = 0, ""
                  for r in rows:
                      code = next((str(r[k]).strip() for k in CODE_KEYS if r.get(k)), None)
                      price = next((to_price(r[k]) for k in PRICE_KEYS if to_price(r.get(k))), None)
                      if not code or price is None:
                          continue
                      d = to_date(next((r[k] for k in DATE_KEYS if r.get(k)), "")) or datetime.date.today().isoformat()
                      if code not in prices or d > prices[code][1]:
                          prices[code] = [round(price, 4), d]
                      newest = max(newest, d)
                      n += 1
                  if n:
                      dates[name] = max(dates.get(name, ""), newest)
                  print(f"{name} {url[:60]}: {n} 筆，日期 {newest or '-'}", "（欄位：" + ", ".join(rows[0].keys()) + "）" if rows and n == 0 else "")
                  ok += n > 0
              except Exception as e:
                  print(f"{name} {url[:60]}: 失敗 {e}")

          if not ok:
              sys.exit("全部資料來源都抓取失敗")
          out = {"updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "dates": dates, "p": prices}
          with open("prices.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print("共", len(prices), "檔")
          PY

      - name: 儲存到 repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "更新收盤價 $(date -u +%F)"
          git push

</script>

/* ===== 自動收盤價（GitHub 每天產生的 prices.json） ===== */
let AUTO=null, AUTOJ=null;
function autoDate(){const ds=Object.values(AUTOJ?.dates||{}).sort();return ds[ds.length-1]||"";}
/* 目前持股實際用到的收盤價日期（可能因上市、上櫃公布時間不同而不一樣） */
function heldAutoRange(){
  const C=compute(), ds=[];
  for(const p of C.pos.values()) if(p.shares>0&&S.prices[p.code]?.src==="auto") ds.push(S.prices[p.code].d);
  if(!ds.length) return "";
  ds.sort(); const f=d=>d.slice(5).replace("-","/");
  return ds[0]===ds[ds.length-1]?f(ds[0]):`${f(ds[0])}～${f(ds[ds.length-1])}`;
}
async function loadAuto(){
  if(location.protocol==="file:"){AUTO=false;render();return;}
  try{
    const r=await fetch("prices.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw 0; AUTOJ=await r.json(); if(!AUTOJ||!AUTOJ.p) throw 0;
    AUTO=true; applyAuto();
  }catch(e){AUTO=false;}
  render();
}
function applyAuto(){
  if(!AUTOJ||S.sample) return;
  let changed=0, latest="";
  for(const code of new Set(S.txs.map(t=>t.code))){
    const a=AUTOJ.p[code]; if(!a) continue; const [px,d]=a, cur=S.prices[code];
    if(!cur||d>cur.d||(d===cur.d&&cur.src!=="manual")){ if(!cur||cur.p!==px||cur.d!==d||cur.src!=="auto"){S.prices[code]={p:px,d,src:"auto"};changed++;} }
    if(d>latest) latest=d;
  }
  if(changed){ snapshot(latest); save(); }
}

/* ===== 走勢圖 ===== */
function ticks(min,max,n=4){if(min===max)max=min+1;const st0=(max-min)/n,m=Math.pow(10,Math.floor(Math.log10(st0))),r=st0/m,st=(r<1.5?1:r<3?2:r<7?5:10)*m;const lo=Math.floor(min/st)*st,hi=Math.ceil(max/st)*st,t=[];for(let v=lo;v<=hi+st/2;v+=st)t.push(v);return t;}
const short=v=>{const a=Math.abs(v);if(a>=1e8)return(v/1e8).toFixed(1)+"億";if(a>=1e4)return(v/1e4).toFixed(a>=1e6?0:1).replace(/\.0$/,"")+"萬";return String(Math.round(v));};
function drawTrend(){
  const box=$("#trend"); if(!box) return; const sn=S.snaps;
  if(sn.length<2){box.innerHTML=`<p class="soft" style="margin:0">至少要有兩天的紀錄才畫得出走勢。之後每次收盤價更新（或你自己改現價），這裡就會多一個點。</p>`;return;}
  const W=Math.max(300,box.clientWidth),H=230,pl=56,pr=16,pt=12,pb=30;
  const t0=+new Date(sn[0].d),t1=+new Date(sn[sn.length-1].d),span=Math.max(1,t1-t0);
  const vals=sn.flatMap(s=>[s.mv,s.cost]),tk=ticks(Math.min(...vals)*.98,Math.max(...vals)*1.02),y0=tk[0],y1=tk[tk.length-1];
  const X=d=>Math.round(pl+(+new Date(d)-t0)/span*(W-pl-pr)), Y=v=>Math.round(pt+(1-(v-y0)/(y1-y0))*(H-pt-pb));
  const path=k=>sn.map((s,i)=>(i?"L":"M")+X(s.d)+","+Y(s[k])).join("");
  const last=sn[sn.length-1], nx=Math.min(5,sn.length), xs=[];
  /* 一年內顯示「月/日」，超過一年顯示「年/月」 */
  const longSpan=span>300*864e5, xLabel=d=>longSpan?`${d.getFullYear()}/${d.getMonth()+1}`:`${d.getMonth()+1}/${d.getDate()}`;
  for(let i=0;i<nx;i++) xs.push(new Date(t0+span*i/(nx-1)));
  box.innerHTML=`<div class="legend"><span><i style="background:var(--ink)"></i>市值</span><span><i style="background:var(--soil)"></i>成本</span><span class="faint" style="margin-left:auto">最新 ${last.d.replace(/-/g,"/")}</span></div>

function importStocks(text){
  if(!text||!text.trim()){toast("請先貼上清單");return;}
  let cur="S",skip=false;const out=[];
  for(let line of text.split(/\r?\n/)){
    line=line.replace(/\u00a0/g," ").trim(); if(!line) continue;
    const sec=line.replace(/\s+/g,"");
    if(!/^[0-9]/.test(sec)&&/^(股票|ETF|ETN|特別股|創新板|臺灣存託憑證.*|受益證券.*|.*權證.*|.*債.*)$/.test(sec)){
      skip=/權證|資產基礎|債/.test(sec)&&sec!=="ETF";
      cur=sec==="ETF"?"E":sec==="ETN"?"N":sec==="特別股"?"P":/存託/.test(sec)?"D":/不動產/.test(sec)?"R":"S"; continue;
    }
    if(skip) continue;
    const m=line.match(/^([0-9][0-9A-Z]{3,6})[\s\u3000,，|\t]+([^\s\u3000,，|\t]+)(.*)$/); if(!m) continue;
    const[,c,n,rest]=m; if(/購|售|牛|熊/.test(n)&&/^[0-9]{6}$/.test(c)) continue;
    const mk=/上市/.test(rest)?"上市":/上櫃/.test(rest)?"上櫃":/興櫃/.test(rest)?"興櫃":"";
    const cells=rest.split(/\t|,/).map(x=>x.trim()).filter(Boolean),mi=cells.findIndex(x=>/上市|上櫃|興櫃/.test(x));
    const ind=mi>=0&&cells[mi+1]&&!/^[A-Z]{4,6}$/.test(cells[mi+1])?cells[mi+1]:"";
    const prev=SMAP.get(c); let t=cur; if(t==="S"&&/^00\d{2,4}[A-Z]?$/.test(c)) t="E";
    out.push({c,n,m:mk||prev?.m||"",t:(prev&&cur==="S"&&!mk)?prev.t:t,i:ind||prev?.i||""});
  }
  const msg=$("#stockMsg");
  if(!out.length){if(msg)msg.textContent="沒讀到股票，格式要是「代號 名稱」，一行一檔。";return;}
  let ex=null;try{ex=JSON.parse(localStorage.getItem(LS_STOCK)||"null");}catch(e){}
  const m=new Map((ex?.rows||[]).map(s=>[s.c,s]));let added=0;
  for(const s of out){if(!SMAP.has(s.c))added++;m.set(s.c,s);}
  try{localStorage.setItem(LS_STOCK,JSON.stringify({date:today(),rows:[...m.values()]}));}catch(e){toast("瀏覽器存不了清單");return;}
  loadStocks();render();const nm=$("#stockMsg");if(nm)nm.textContent=`讀到 ${out.length} 檔，新增 ${added} 檔。`;toast(`清單已更新，新增 ${added} 檔`);
}

const inp=$("#fStock"),lst=$("#stockList");let hits=[],hi=0;
function search(q){
  q=q.trim().toLowerCase();if(!q)return[];const ws=q.split(/\s+/),r=[];
  for(const s of STOCKS){const c=s.c.toLowerCase(),n=s.n.toLowerCase();let sc=-1;
    if(ws.length===1){if(c===q)sc=100;else if(c.startsWith(q))sc=80-c.length;else if(n===q)sc=90;else if(n.startsWith(q))sc=60;else if(n.includes(q))sc=40;}
    else if(ws.every(w=>n.includes(w)||c.includes(w)))sc=30;
    if(sc>=0){if(s.m==="興櫃")sc-=2;r.push([sc,s]);}}
  return r.sort((a,b)=>b[0]-a[0]||a[1].c.localeCompare(b[1].c)).slice(0,40).map(x=>x[1]);
}

  }else{
    const shares=qty(),price=num($("#fPrice").value);
    if(!(shares>0))return err("請填數量");if(!(price>0))return err("請填價格");
    const t={id:EDIT?.id||uid(),type:TYPE,date,code,shares,price,fee:Math.round(num($("#fFee").value)||0),feeAuto:!man.fee,note,seq};
    if(TYPE==="sell"){
      t.tax=Math.round(num($("#fTax").value)||0);t.taxAuto=!man.tax;t.day=$("#fDay").checked;
      const held=(compute().pos.get(code)?.shares||0)+(EDIT&&EDIT.type==="sell"&&EDIT.code===code?EDIT.shares:0);
      if(shares>held)return err(`賣出股數比持有的多（目前 ${f0(held)} 股）`);
    }
    out.push(t);
  }
  if(EDIT){const rm=new Set([EDIT.id]);S.txs.filter(x=>x.reOf===EDIT.id).forEach(x=>rm.add(x.id));S.txs=S.txs.filter(x=>!rm.has(x.id));}
  if(S.sample){S.txs=[];S.prices={};S.snaps=[];S.sample=false;}
  S.txs.push(...out);
  applyAuto();
  const wp=out.find(x=>x.price>0);if(!S.prices[code]&&wp)S.prices[code]={p:wp.price,d:wp.date};
  save();dlg.close();render();toast(EDIT?"已修改 ✓":"記好了 ✓");
});
$("#dDel").addEventListener("click",e=>{
  const b=e.currentTarget;if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="確定刪除？再按一次";return;}
  const rm=new Set([EDIT.id]);S.txs.filter(x=>x.reOf===EDIT.id).forEach(x=>rm.add(x.id));
  S.txs=S.txs.filter(x=>!rm.has(x.id));save();dlg.close();render();toast("已刪除");
});

/* ===== 範例 ===== */
function sample(){
  const T=[];let q=1;
  const buy=(d,c,n,p)=>T.push({id:uid(),type:"buy",date:d,code:c,shares:n,price:p,fee:calcFee(V(n,p),n),feeAuto:true,note:"",seq:q++});
  const sell=(d,c,n,p)=>T.push({id:uid(),type:"sell",date:d,code:c,shares:n,price:p,fee:calcFee(V(n,p),n),feeAuto:true,tax:calcTax(V(n,p),c,false),day:false,note:"",seq:q++});
  const div=(d,c,a,rp)=>{const id=uid();T.push({id,type:"div",date:d,code:c,amount:a,note:"",seq:q++});if(rp){let n=Math.floor(a/(rp*1.001425));while(V(n,rp)+calcFee(V(n,rp),n)>a)n--;T.push({id:uid(),type:"buy",date:d,code:c,shares:n,price:rp,fee:calcFee(V(n,rp),n),feeAuto:true,reOf:id,note:"股利再投資",seq:q++});}};
  buy("2025-03-12","0050",1000,183.5);buy("2025-04-10","2330",200,862);buy("2025-05-06","0056",2000,33.42);
  buy("2025-06-18","2884",3000,28.15);buy("2025-07-08","00878",2000,20.6);div("2025-07-17","0050",1000);
  div("2025-08-19","00878",960,20.9);buy("2025-08-22","2330",100,1155);div("2025-08-26","0056",2152,34.8);
  sell("2025-09-24","2884",1000,31.45);div("2025-10-08","2330",1500);div("2025-11-19","00878",800,21.3);
  buy("2026-01-14","0050",500,196.4);div("2026-01-20","0050",1880);div("2026-02-24","00878",720,21.95);
  div("2026-04-14","2330",1500);div("2026-05-21","00878",800,21.6);div("2026-08-05","2884",2410);div("2026-08-20","00878",830,22.05);
  S.txs=T;S.sample=true;
  S.prices={"0050":{p:204.15,d:today()},"2330":{p:1215,d:today()},"0056":{p:35.62,d:today()},"2884":{p:33.2,d:today()},"00878":{p:22.36,d:today()}};
  S.snaps=[];
  for(const[d,k]of[["2025-06-30",.97],["2025-08-29",1.02],["2025-10-31",1.06],["2025-12-31",1.04],["2026-02-27",1.09],["2026-04-30",1.12],["2026-06-30",1.10],["2026-08-31",1.15]]){
    S.txs=T.filter(t=>t.date<=d);const C=compute();S.snaps.push({d,mv:Math.round(C.tot.cost*k),cost:Math.round(C.tot.cost)});
  }
  S.txs=T;snapshot();
}

loadStocks();
if(!load()){sample();save();}
render();
loadAuto();
})();
